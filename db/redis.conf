# Redis Configuration for Phone Store E-commerce

# ============================================
# General Settings
# ============================================
bind 0.0.0.0
port 6379
daemonize no
supervised no
pidfile /var/run/redis.pid
loglevel notice
logfile ""

# ============================================
# Memory Management
# ============================================
maxmemory 256mb
maxmemory-policy allkeys-lru

# ============================================
# Persistence (RDB + AOF)
# ============================================
# RDB Snapshots
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF (Append Only File)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ============================================
# Security
# ============================================
# requirepass phonestore_redis (commented for local dev)

# ============================================
# Keyspace Notifications (for cache eviction events)
# ============================================
notify-keyspace-events Ex

# ============================================
# Client Settings
# ============================================
timeout 0
tcp-keepalive 300
tcp-backlog 511
