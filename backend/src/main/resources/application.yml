server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: phone-store

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect
    open-in-view: false

  datasource:
    url: jdbc:mariadb://localhost:3306/phonestore_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
    username: phonestore
    password: phonestore123
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  data:
    mongodb:
      uri: mongodb://admin:admin123@localhost:27017/phonestore_logs?authSource=admin
      auto-index-creation: true

    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSZ
    time-zone: Asia/Ho_Chi_Minh

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        debug: false

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:phonestore-secure-jwt-secret-key-2024-longer-for-security}
  access-token:
    expiration: 86400000  # 24 hours in milliseconds
  refresh-token:
    expiration: 604800000  # 7 days in milliseconds

# Logging - Using Log4j2 (configured in log4j2.xml)
# logging.config is automatically loaded from classpath:log4j2.xml

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# CORS
cors:
  allowed-origins: "http://localhost:3000,http://localhost:5173"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
  allowed-headers: "*"
  allow-credentials: true

# VNPay Configuration
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:TESTCODE}
  hash-secret: ${VNPAY_HASH_SECRET:TESTSECRET}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:3000/payment/callback}
  api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}

# App Configuration
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

# File Upload Configuration
file:
  upload-dir: uploads
