<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xac nhan don hang</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #D70018; color: white; padding: 20px; text-align: center; }
        .content { background: #f9f9f9; padding: 20px; margin: 20px 0; }
        .footer { text-align: center; color: #666; font-size: 12px; }
        .btn { display: inline-block; background: #D70018; color: white; padding: 12px 24px;
               text-decoration: none; border-radius: 4px; margin: 10px 0; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Xac nhan don hang</h1>
        </div>

        <div class="content">
            <p>Cam on ban da dat hang tai Phone Store!</p>

            <h3>Thong tin don hang: <span th:text="${order.orderNumber}"></span></h3>

            <table>
                <tr>
                    <td>Tong tien:</td>
                    <td><strong th:text="${formattedTotal}"></strong></td>
                </tr>
                <tr>
                    <td>Phuong thuc thanh toan:</td>
                    <td th:text="${order.paymentMethod}"></td>
                </tr>
                <tr>
                    <td>Dia chi giao hang:</td>
                    <td th:text="${order.shippingName + ', ' + order.shippingPhone + ', ' + order.shippingAddress}"></td>
                </tr>
            </table>

            <p style="text-align: center;">
                <a th:href="${orderUrl}" class="btn">Xem chi tiet don hang</a>
            </p>
        </div>

        <div class="footer">
            <p>Neu ban co bat ky cau hoi nao, vui long lien he chung toi tai support@phonestore.com</p>
            <p>&copy; 2024 Phone Store. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
